# ============================================================
# SIH26153 — AI-Based Network Attack Forecasting
# Docker Compose: development + production
# ============================================================

services:
  # ── Development server ──────────────────────────────────
  dev:
    build:
      context: .
      target: development
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - .:/app
      - dev-data:/app/data
    environment:
      - FLASK_DEBUG=1
      - PORT=5000
      - ENABLE_FORECASTING_MODEL=1
      - ENABLE_KILLCHAIN=1
      - RATE_LIMIT_ENABLED=0
    command: python run.py --no-pipeline
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/status')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Pipeline runner (one-shot) ──────────────────────────
  pipeline:
    build:
      context: .
      target: development
    volumes:
      - dev-data:/app/data
    environment:
      - ENABLE_FORECASTING_MODEL=1
      - ENABLE_KILLCHAIN=1
    command: python run.py --pipeline-only
    profiles:
      - pipeline

  # ── Production server ───────────────────────────────────
  prod:
    build:
      context: .
      target: production
    ports:
      - "${PROD_PORT:-8000}:5000"
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-change-me-in-production}
      - PORT=5000
      - ENABLE_FORECASTING_MODEL=1
      - ENABLE_KILLCHAIN=1
      - RATE_LIMIT_ENABLED=1
    volumes:
      - prod-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/status')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  # ── Test runner ─────────────────────────────────────────
  test:
    build:
      context: .
      target: development
    volumes:
      - .:/app
    environment:
      - RATE_LIMIT_ENABLED=0
    command: python -m pytest tests/ -v --tb=short
    profiles:
      - test

volumes:
  dev-data:
    driver: local
  prod-data:
    driver: local
