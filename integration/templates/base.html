<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}NetWatch — SIH26153{% endblock %}</title>

  <!-- Tailwind (CDN for prototype) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface:  '#f5f3ff',
            card:     'rgba(255, 255, 255, 0.7)',
            border:   'rgba(196, 181, 253, 0.7)',
            accent:   '#7c3aed',
            muted:    '#6b7280',
            critical: '#dc2626',
            high:     '#d97706',
            medium:   '#2563eb',
            low:      '#16a34a',
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        }
      }
    }
  </script>

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Plotly -->
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
</head>

<body class="bg-surface font-sans min-h-screen flex flex-col antialiased" style="color:#000000; style="background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 40%, #f5f3ff 100%); background-attachment: fixed;">

  <!-- ── Top nav ─────────────────────────────────────────── -->
  <header class="border-b px-6 py-3 flex items-center justify-between sticky top-0 z-50" style="background: rgba(255,255,255,0.8); border-color: rgba(196,181,253,0.4); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);">
    <div class="flex items-center gap-3">
      <!-- pulse dot -->
      <span class="relative flex h-2.5 w-2.5">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-low opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-low"></span>
      </span>
      <a href="/" class="font-bold tracking-tight text-sm" style="color:#000000">NetWatch</a>
      <span class="text-muted text-xs px-2 py-0.5 rounded border border-border">SIH-26153</span>
    </div>

    <nav class="flex items-center gap-1 text-xs">
      <a href="/"           class="nav-link {% if request.path == '/' %}nav-active{% endif %}">Overview</a>
      <a href="/events"     class="nav-link {% if request.path == '/events' %}nav-active{% endif %}">Events</a>
      <a href="/graph"      class="nav-link {% if request.path == '/graph' %}nav-active{% endif %}">Attack Graph</a>
      <a href="/killchain"  class="nav-link {% if request.path == '/killchain' %}nav-active{% endif %}">Kill Chain</a>
    </nav>

    <div class="flex items-center gap-3">
      <span id="last-updated" class="text-muted text-xs hidden sm:block">—</span>
      <button id="run-pipeline-btn"
              class="text-xs px-3 py-1.5 rounded bg-accent text-white font-medium hover:opacity-90 transition-opacity flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 3l14 9-14 9V3z"/>
        </svg>
        Run Pipeline
      </button>
    </div>
  </header>

  <!-- ── Pipeline toast ─────────────────────────────────── -->
  <div id="pipeline-toast" class="hidden fixed bottom-5 right-5 z-50 max-w-sm bg-white border border-border rounded-lg shadow-xl px-4 py-3 text-sm" style="backdrop-filter: blur(12px);">
    <div class="flex items-start gap-3">
      <span id="toast-icon" class="mt-0.5 text-medium">⏳</span>
      <div>
        <p id="toast-title" class="font-medium text-gray-900">Running pipeline…</p>
        <p id="toast-body" class="text-muted text-xs mt-0.5">This may take 15–30 seconds.</p>
      </div>
      <button onclick="document.getElementById('pipeline-toast').classList.add('hidden')"
              class="ml-auto text-muted hover:text-stone-900">✕</button>
    </div>
  </div>

  <!-- ── Main content ────────────────────────────────────── -->
  <main class="flex-1 px-6 py-6 max-w-screen-2xl mx-auto w-full">
    {% block content %}{% endblock %}
  </main>

  <!-- ── Footer ─────────────────────────────────────────── -->
  <footer class="border-t border-border text-muted text-xs px-6 py-3 flex justify-between items-center">
    <span>SIH-26153 · AI-Based Network Attack Forecasting · NTRO</span>
    <span>Built with NTAV · PS40 · Killchain Engine</span>
  </footer>

  <!-- Custom cursor animation -->
  <div id="cursor-dot" style="position:fixed;top:0;left:0;width:8px;height:8px;background:#7c3aed;border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .2s,height .2s,background .2s;mix-blend-mode:normal;"></div>
  <div id="cursor-ring" style="position:fixed;top:0;left:0;width:36px;height:36px;border:2px solid rgba(124,58,237,0.5);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .3s,height .3s,border-color .3s;"></div>
  <div id="cursor-glow" style="position:fixed;top:0;left:0;width:120px;height:120px;background:radial-gradient(circle,rgba(124,58,237,0.15) 0%,transparent 70%);border-radius:50%;pointer-events:none;z-index:9997;transform:translate(-50%,-50%);transition:opacity .3s;"></div>

  <script>
    (function() {
      const dot = document.getElementById('cursor-dot');
      const ring = document.getElementById('cursor-ring');
      const glow = document.getElementById('cursor-glow');
      let mx = 0, my = 0, rx = 0, ry = 0;

      document.addEventListener('mousemove', function(e) {
        mx = e.clientX; my = e.clientY;
        dot.style.left = mx + 'px'; dot.style.top = my + 'px';
        glow.style.left = mx + 'px'; glow.style.top = my + 'px';
      });

      function animateRing() {
        rx += (mx - rx) * 0.12;
        ry += (my - ry) * 0.12;
        ring.style.left = rx + 'px';
        ring.style.top = ry + 'px';
        requestAnimationFrame(animateRing);
      }
      animateRing();

      // Hover effects on interactive elements
      document.querySelectorAll('a, button, [role="button"], .hover\\:bg-border\\/30').forEach(function(el) {
        el.addEventListener('mouseenter', function() {
          dot.style.width = '14px'; dot.style.height = '14px';
          dot.style.background = '#2563eb';
          ring.style.width = '50px'; ring.style.height = '50px';
          ring.style.borderColor = 'rgba(37,99,235,0.5)';
          glow.style.background = 'radial-gradient(circle,rgba(37,99,235,0.2) 0%,transparent 70%)';
        });
        el.addEventListener('mouseleave', function() {
          dot.style.width = '8px'; dot.style.height = '8px';
          dot.style.background = '#7c3aed';
          ring.style.width = '36px'; ring.style.height = '36px';
          ring.style.borderColor = 'rgba(124,58,237,0.5)';
          glow.style.background = 'radial-gradient(circle,rgba(124,58,237,0.15) 0%,transparent 70%)';
        });
      });

      // Click pulse effect
      document.addEventListener('mousedown', function() {
        dot.style.width = '6px'; dot.style.height = '6px';
        ring.style.width = '28px'; ring.style.height = '28px';
      });
      document.addEventListener('mouseup', function() {
        dot.style.width = '8px'; dot.style.height = '8px';
        ring.style.width = '36px'; ring.style.height = '36px';
      });

      // Trail sparkle — spawn small fading dots along the path
      var trailTimer = 0;
      document.addEventListener('mousemove', function(e) {
        var now = Date.now();
        if (now - trailTimer < 40) return; // throttle to ~25fps
        trailTimer = now;
        var spark = document.createElement('div');
        spark.className = 'cursor-trail';
        spark.style.left = e.clientX + 'px';
        spark.style.top = e.clientY + 'px';
        document.body.appendChild(spark);
        setTimeout(function() { spark.remove(); }, 600);
      });

      // Hide cursor on touch devices
      if ('ontouchstart' in window) {
        dot.style.display = 'none';
        ring.style.display = 'none';
        glow.style.display = 'none';
      }
    })();
  </script>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
